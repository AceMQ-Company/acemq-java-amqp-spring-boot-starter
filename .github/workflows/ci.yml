# Build and test, on every JDK and every Spring Boot line this starter promises
# to work on.
#
# The Boot dimension is not decoration: Boot 4 moved the health contributor API to
# a different package in a different artifact, and the only thing that catches a
# regression there is starting a real context with the starter's own classpath on
# each line, which acemq-spring-boot-starter-tests does.
#
# Integration tests need Docker, which ubuntu-latest has, so `verify` is the goal
# rather than `test`: an auto-configuration that is only unit-tested proves the
# beans exist, not that a broker accepts what they declare.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # acemq-java-amqp can release without a commit landing here, so this workflow
  # also runs on a timer. That is the only thing that will ever notice a library
  # release moving underneath an untouched repository, which is exactly how
  # <acemq.version> sat at 0.2.10 while the library reached 0.7.3.
  schedule:
    - cron: '29 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: JDK ${{ matrix.java }}, Boot ${{ matrix.boot }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17 is Spring Boot 3's minimum and this artifact's baseline; 21 is what
        # most new Boot applications run on; 25 is the newest release.
        java: ['17', '21', '25']
        # Both supported lines. The shared modules are compiled and tested against
        # whichever is named here; the two health modules always compile against
        # their own line, whatever this says.
        boot: ['3.5.7', '4.1.0']
        exclude:
          # One JDK is enough to catch a Boot-line break, and the matrix is a
          # product: six jobs to prove what four do.
          - java: '21'
            boot: '4.1.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: mvn -B --no-transfer-progress -Dspring.boot.version=${{ matrix.boot }} clean verify

      - name: Verify the bytecode targets Java 17
        if: matrix.java == '17' && matrix.boot == '3.5.7'
        run: |
          class=$(unzip -p acemq-spring-boot-autoconfigure/target/acemq-spring-boot-autoconfigure-*.jar \
                  org/acemq/spring/boot/AceListener.class | xxd -p -l 8 | cut -c13-16)
          echo "class file major version: 0x$class (expected 003d = 61 = Java 17)"
          test "$class" = "003d"

      - name: Verify every auto-configuration is registered
        if: matrix.java == '17' && matrix.boot == '3.5.7'
        # A starter whose AutoConfiguration.imports is missing or misspelled is a
        # starter that configures nothing, and every test here would still pass
        # because they import the class explicitly.
        run: |
          imports=META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports
          unzip -p acemq-spring-boot-autoconfigure/target/acemq-spring-boot-autoconfigure-*.jar "$imports" \
            | grep -qx 'org.acemq.spring.boot.AceMqAutoConfiguration'
          unzip -p acemq-spring-boot-health-boot3/target/acemq-spring-boot-health-boot3-*.jar "$imports" \
            | grep -qx 'org.acemq.spring.boot.health.boot3.AceMqHealthAutoConfiguration'
          unzip -p acemq-spring-boot-health-boot4/target/acemq-spring-boot-health-boot4-*.jar "$imports" \
            | grep -qx 'org.acemq.spring.boot.health.boot4.AceMqHealthAutoConfiguration'

      - name: Verify the configuration metadata was generated
        if: matrix.java == '17' && matrix.boot == '3.5.7'
        # Without it, acemq.* does not complete in an IDE and every property is a
        # string somebody has to spell from memory.
        run: |
          unzip -p acemq-spring-boot-autoconfigure/target/acemq-spring-boot-autoconfigure-*.jar \
            META-INF/spring-configuration-metadata.json | grep -q '"acemq.url"'

  tracks-the-release:
    name: the pin is the newest release
    runs-on: ubuntu-latest
    # A job of its own rather than another step in the matrix above, deliberately.
    # A stale pin and a broken starter are different findings and both are worth
    # having: the build still compiles and the tests still run no matter what this
    # job says, so a red X here reads as "the pinned library is old", never as "we
    # have no idea whether any of this works".
    #
    # The examples repositories have carried this job for a while and it works --
    # it caught the .NET examples within an hour of a release. This repository
    # needed it more and had it less. An examples repository pinned old merely
    # proves something about a version nobody installs; a starter pinned old
    # *ships* that version to everybody who adds the starter, and that is what
    # happened: <acemq.version> resolved 0.2.10 into a published artifact while
    # acemq-java-amqp was at 0.7.3, so anyone who took the starter got a library
    # with none of the concurrency fix, the shutdown-timeout fix, the
    # blocked-connection work, or the amqp-client security bumps.
    steps:
      - uses: actions/checkout@v4

      - name: The pinned library is the newest released one
        # Hard failure rather than a warning, for the same reason the examples
        # repositories fail hard: a warning in a log is what let the pin fall five
        # minor versions behind without anybody noticing. A green build is read as
        # an answer, and a green build over a five-release-old dependency answers
        # the wrong question.
        #
        # The cost is real and worth stating. A library release legitimately lands
        # before this repository is updated, and during that window this job is red
        # on a repository nobody has broken. But that window is the thing being
        # measured, and the fix is a one-line version bump.
        #
        # The tags are asked of the library repository rather than of the Maven
        # feed: git ls-remote needs no token, which matters on a scheduled run, and
        # the tag is what the release was cut from.
        run: |
          pinned=$(sed -n 's/.*<acemq\.version>\(.*\)<\/acemq\.version>.*/\1/p' pom.xml | head -1)
          newest=$(git ls-remote --tags https://github.com/AceMQ-Company/acemq-java-amqp \
                     | grep -v '\^{}' | sed 's#.*refs/tags/##' \
                     | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' \
                     | sort -V | tail -1)

          # An empty answer means the listing failed or the tag naming changed, and
          # comparing against nothing would pass silently forever.
          if [ -z "$newest" ]; then
            echo "::error::no release tags found on acemq-java-amqp, so the pin could not be checked"
            exit 1
          fi
          if [ -z "$pinned" ]; then
            echo "::error::no <acemq.version> found in pom.xml, so the pin could not be checked"
            exit 1
          fi

          if [ "$pinned" != "$newest" ]; then
            echo "::error::pom.xml pins acemq-java-amqp $pinned but the newest release is $newest. Edit <acemq.version> in pom.xml and set it to $newest, then build the starter against it."
            exit 1
          fi
          echo "pinned acemq-java-amqp $pinned, which is the newest release"

  badge-matches-the-release:
    name: the README badge names the current release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare the version badge against the newest release tag
        # A README badge is the first thing a reader sees and nothing keeps it
        # in step. This one said 0.1.4 while the library was at 0.7.0 -- six
        # minor versions, sitting at the top of the page, wrong since 0.1.4 was
        # the truth. acemq-java-amqp stays correct only because its release
        # rewrites the documented version; every other repository updates the
        # badge by hand, which means sometimes.
        #
        # Tags come from ls-remote so this needs no token on a scheduled run.
        # Only plain vX.Y.Z tags count: Go publishes nested modules as
        # codec/avro/vX.Y.Z, and those are not the repository's version.
        run: |
          newest=$(git ls-remote --tags origin \
            | sed -e 's#.*refs/tags/##' -e 's#\^{}$##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^v//' | sort -V | tail -1)
          badge=$(grep -oE 'badge/version-[0-9][0-9.]*' README.md | head -1 | sed 's|badge/version-||')

          if [ -z "$newest" ]; then
            echo "no release tags yet, so there is nothing for the badge to disagree with"
            exit 0
          fi
          if [ -z "$badge" ]; then
            echo "::error::no version badge found in README.md, so this check cannot do its job"
            exit 1
          fi
          # Behind is the failure; ahead is a release being prepared.
          #
          # The badge is bumped in the commit that readies a release, which is
          # pushed before the tag exists -- so for a few minutes the badge names
          # a version no tag does. Failing on any difference would redden that
          # commit and block the release it is part of, which is the check
          # sabotaging the thing it is meant to protect. Only a badge older than
          # the newest release is wrong.
          older=$(printf '%s\n%s\n' "$badge" "$newest" | sort -V | head -1)
          if [ "$badge" != "$newest" ] && [ "$older" = "$badge" ]; then
            echo "::error::the README badge says $badge but the newest release is $newest."
            echo "::error::Edit the version badge in README.md and set it to $newest."
            exit 1
          fi
          if [ "$badge" != "$newest" ]; then
            echo "the badge says $badge and the newest release is $newest; a release looks to be in flight"
            exit 0
          fi
          echo "the badge says $badge, which is the newest release"
