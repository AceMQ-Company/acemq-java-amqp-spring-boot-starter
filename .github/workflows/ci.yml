# Build and test, on every JDK and every Spring Boot line this starter promises
# to work on.
#
# The Boot dimension is not decoration: Boot 4 moved the health contributor API to
# a different package in a different artifact, and the only thing that catches a
# regression there is starting a real context with the starter's own classpath on
# each line, which acemq-spring-boot-starter-tests does.
#
# Integration tests need Docker, which ubuntu-latest has, so `verify` is the goal
# rather than `test`: an auto-configuration that is only unit-tested proves the
# beans exist, not that a broker accepts what they declare.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: JDK ${{ matrix.java }}, Boot ${{ matrix.boot }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17 is Spring Boot 3's minimum and this artifact's baseline; 21 is what
        # most new Boot applications run on; 25 is the newest release.
        java: ['17', '21', '25']
        # Both supported lines. The shared modules are compiled and tested against
        # whichever is named here; the two health modules always compile against
        # their own line, whatever this says.
        boot: ['3.5.7', '4.1.0']
        exclude:
          # One JDK is enough to catch a Boot-line break, and the matrix is a
          # product: six jobs to prove what four do.
          - java: '21'
            boot: '4.1.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: mvn -B --no-transfer-progress -Dspring.boot.version=${{ matrix.boot }} clean verify

      - name: Verify the bytecode targets Java 17
        if: matrix.java == '17' && matrix.boot == '3.5.7'
        run: |
          class=$(unzip -p acemq-spring-boot-autoconfigure/target/acemq-spring-boot-autoconfigure-*.jar \
                  org/acemq/spring/boot/AceListener.class | xxd -p -l 8 | cut -c13-16)
          echo "class file major version: 0x$class (expected 003d = 61 = Java 17)"
          test "$class" = "003d"

      - name: Verify every auto-configuration is registered
        if: matrix.java == '17' && matrix.boot == '3.5.7'
        # A starter whose AutoConfiguration.imports is missing or misspelled is a
        # starter that configures nothing, and every test here would still pass
        # because they import the class explicitly.
        run: |
          imports=META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports
          unzip -p acemq-spring-boot-autoconfigure/target/acemq-spring-boot-autoconfigure-*.jar "$imports" \
            | grep -qx 'org.acemq.spring.boot.AceMqAutoConfiguration'
          unzip -p acemq-spring-boot-health-boot3/target/acemq-spring-boot-health-boot3-*.jar "$imports" \
            | grep -qx 'org.acemq.spring.boot.health.boot3.AceMqHealthAutoConfiguration'
          unzip -p acemq-spring-boot-health-boot4/target/acemq-spring-boot-health-boot4-*.jar "$imports" \
            | grep -qx 'org.acemq.spring.boot.health.boot4.AceMqHealthAutoConfiguration'

      - name: Verify the configuration metadata was generated
        if: matrix.java == '17' && matrix.boot == '3.5.7'
        # Without it, acemq.* does not complete in an IDE and every property is a
        # string somebody has to spell from memory.
        run: |
          unzip -p acemq-spring-boot-autoconfigure/target/acemq-spring-boot-autoconfigure-*.jar \
            META-INF/spring-configuration-metadata.json | grep -q '"acemq.url"'

  notify:
    needs: build
    # Only when main breaks, and only on main -- a failing pull request is
    # already in front of the person who wrote it.
    if: always() && needs.build.result == 'failure' && github.ref == 'refs/heads/main'
    uses: AceMQ-Company/acemq-java-amqp/.github/workflows/slack-notify.yml@main
    with:
      status: ${{ needs.build.result }}
      title: "AceMQ Spring Boot starter: main is failing"
      message: "The build on main did not pass. Artifacts from it should not be trusted."
      url: https://github.com/AceMQ-Company/acemq-java-amqp-spring-boot-starter/actions/workflows/ci.yml
    secrets:
      # Explicit, not `inherit`. A reusable workflow in another repository
      # does not receive inherited secrets, so `inherit` here produced a
      # notify job that went green while sending nothing at all -- the
      # shared workflow treats a missing webhook as "nothing to notify"
      # and succeeds, by design, so the silence looked like health.
      SLACK_DELIVERY_WEBHOOK: ${{ secrets.SLACK_DELIVERY_WEBHOOK }}
